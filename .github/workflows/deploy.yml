name: Deploy

on:
  push:
    # main only. While the session branch was also listed, pushing the same
    # commit to both raced two deploys into the `pages` concurrency group and
    # cancel-in-progress killed one of them.
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          # GitHub Pages serves project sites from /<repo>, so assets need the
          # base path. Deploying elsewhere (Vercel, a custom domain) means
          # dropping this one variable.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Disable Jekyll processing
        # Without this, Pages ignores the _next directory because it starts with
        # an underscore, and every asset 404s.
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
