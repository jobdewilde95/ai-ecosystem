name: Refresh data

# One weekly pass over every source.
#
# Weekly costs no market history: the Yahoo fetcher requests a multi-year range
# and the history writer de-duplicates by (ticker, date), so a Monday run still
# records every trading day of the preceding week. Token prices are written as
# change events, so a weekly cadence only loses a price that moved and moved
# back inside the same week.
#
# Monday 07:00 UTC is Sunday evening in the US: markets are closed, so the run
# picks up a settled Friday close plus the week's filings.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Which sources to refresh (all of them by default)'
        required: false
        default: 'daily,weekly,monthly'
        type: choice
        options: ['daily,weekly,monthly', daily, weekly, monthly]

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Select tier
        id: tier
        # The schedule refreshes everything; a manual run may narrow it.
        run: |
          if [ -n "${{ github.event.schedule }}" ]; then
            echo "value=daily,weekly,monthly" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.tier || 'daily,weekly,monthly' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch sources
        id: fetch
        env:
          # SEC returns 403 without a contact address in the User-Agent.
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          # Absent, the Artificial Analysis fetcher skips rather than fails and
          # the site keeps serving its last good benchmark snapshot.
          ARTIFICIALANALYSIS_API_KEY: ${{ secrets.ARTIFICIALANALYSIS_API_KEY }}
        # A failed source keeps its previous snapshot and is marked stale, so a
        # non-zero exit is reported but must not stop the derive and commit.
        continue-on-error: true
        run: npm run data:fetch -- --tier ${{ steps.tier.outputs.value }}

      - name: Rebuild seeded and derived data
        run: |
          npm run data:seed
          npm run data:derive

      - name: Verify tests still pass against the new data
        run: npm test

      - name: Commit changes
        id: commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            # [skip ci] keeps this commit from re-triggering CI; the deploy below
            # is dispatched explicitly instead, so the cron cannot loop.
            git commit -m "chore(data): weekly refresh (${{ steps.tier.outputs.value }}) [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the refreshed site
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report source failures
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::One or more sources failed to refresh. Previous snapshots were"
          echo "::warning::retained and are flagged stale in the UI. See the fetch step log."
